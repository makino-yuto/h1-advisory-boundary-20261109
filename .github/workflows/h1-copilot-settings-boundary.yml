name: H1 synthetic Copilot settings permission check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check repository-scoped token against settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/makino-yuto/h1-advisory-boundary-20261109"
          common=(-H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2026-03-10" -H "Authorization: Bearer ${GH_TOKEN}")
          meta=$(curl -sS --max-time 15 "${common[@]}" -o meta.json -w '%{http_code}' "${api}")
          echo "own_public_repo_http=${meta}"
          if [[ "${GH_TOKEN}" == ghs_* && ${#GH_TOKEN} -gt 100 ]]; then echo 'token_format_class=long_ghs'; else echo 'token_format_class=other'; fi
          private_url='https://api.github.com/repos/makino-yuto/h1-creation-boundary-20261109-seed/contents/README.md'
          private_code=$(curl -sS --max-time 15 "${common[@]}" -o private-read.json -w '%{http_code}' "${private_url}")
          echo "other_private_repo_read_http=${private_code}"
          if [ "$private_code" = 200 ]; then jq -c '{name,path,type,size}' private-read.json; else jq -r '.message // "no-message"' private-read.json; fi
          read_code=$(curl -sS --max-time 15 "${common[@]}" -o read.json -w '%{http_code}' "${api}/copilot/code-review/settings")
          echo "copilot_settings_read_http=${read_code}"
          if [ "$read_code" != 200 ]; then jq -r '.message // "no-message"' read.json; fi
          write_code=$(curl -sS --max-time 15 "${common[@]}" -X PATCH -H "Content-Type: application/json" --data '{"mcp_enabled":false}' -o write.json -w '%{http_code}' "${api}/copilot/code-review/settings")
          echo "copilot_settings_patch_http=${write_code}"
          if [ "$write_code" != 200 ]; then jq -r '.message // "no-message"' write.json; fi
          gql_read='{"query":"query { repository(owner:\"makino-yuto\",name:\"h1-advisory-boundary-20261109\") { nameWithOwner repositoryCopilotCodeReviewSettings { mcpEnabled } } }"}'
          gql_read_code=$(curl -sS --max-time 15 "${common[@]}" -H "Content-Type: application/json" --data "$gql_read" -o gql-read.json -w '%{http_code}' 'https://api.github.com/graphql')
          echo "graphql_settings_read_http=${gql_read_code}"
          jq -c '{repository: .data.repository.nameWithOwner, setting: .data.repository.repositoryCopilotCodeReviewSettings, errors: [.errors[]? | {type,message}]}' gql-read.json
          gql_write='{"query":"mutation { updateRepositoryCopilotCodeReviewSettings(input:{repositoryId:\"R_kgDOVoOzAA\",mcpEnabled:false}) { settings { mcpEnabled } } }"}'
          gql_write_code=$(curl -sS --max-time 15 "${common[@]}" -H "Content-Type: application/json" --data "$gql_write" -o gql-write.json -w '%{http_code}' 'https://api.github.com/graphql')
          echo "graphql_settings_mutation_http=${gql_write_code}"
          jq -c '{setting: .data.updateRepositoryCopilotCodeReviewSettings.settings, errors: [.errors[]? | {type,message}]}' gql-write.json
